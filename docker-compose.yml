# 考功司 · 本地自包含全栈（一键 docker compose up）
# 参考 Langfuse 的自托管思路：一条命令拉起后端 + 前端；账号/授权持久化到命名卷。
# 生产可把 api 的存储端口从 JSON 文件换成 Postgres（见 packages/auth-core StoragePort）。

services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      PORT: '3001'
      KAOGONGSI_DATA_DIR: /data
      KAOGONGSI_JWT_SECRET: ${KAOGONGSI_JWT_SECRET:-please-change-in-prod}
      # 可选：接真实 LLM（对比报告）——留空则用离线确定性模板
      KAOGONGSI_LLM_BASE_URL: ${KAOGONGSI_LLM_BASE_URL:-}
      KAOGONGSI_LLM_API_KEY: ${KAOGONGSI_LLM_API_KEY:-}
      KAOGONGSI_LLM_MODEL: ${KAOGONGSI_LLM_MODEL:-}
      # 可选：轨迹接入（RFC-006）。留空=用内置 Mock 数据。
      #   file:/trajectories 遍历挂载卷；或 http(s)://host/api/traces 拉取
      KAOGONGSI_INGEST: ${KAOGONGSI_INGEST:-}
      KAOGONGSI_PARSERS: ${KAOGONGSI_PARSERS:-}
      KAOGONGSI_INGEST_HEADERS: ${KAOGONGSI_INGEST_HEADERS:-}
      KAOGONGSI_INGEST_TAGS: ${KAOGONGSI_INGEST_TAGS:-}
      KAOGONGSI_INGEST_FROM: ${KAOGONGSI_INGEST_FROM:-}
      KAOGONGSI_INGEST_TO: ${KAOGONGSI_INGEST_TO:-}
    volumes:
      - kg-data:/data
      # 放开以从本地文件夹接入轨迹（配合 KAOGONGSI_INGEST=file:/trajectories）：
      # - ./trajectories:/trajectories:ro
    ports:
      - '3001:3001' # 便于直接调试 api（web 已经 /api 反代，不依赖此端口）
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    depends_on:
      - api
    ports:
      - '8080:80'
    restart: unless-stopped

volumes:
  kg-data:
