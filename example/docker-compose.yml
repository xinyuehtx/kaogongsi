# 考功司 · 本地自包含全栈（一键 docker compose up）
# example：Postgres/Prisma（DB）+ Redis（缓存）+ api + web。账号/授权/文档/溯源入 Postgres，
# 插件 KV 缓存入 Redis；未配 DATABASE_URL/REDIS_URL 时 api 回落内存/文件（防腐层装配）。

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kaogongsi
      POSTGRES_PASSWORD: kaogongsi
      POSTGRES_DB: kaogongsi
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U kaogongsi']
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  cache:
    image: redis:7-alpine
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: example/app/Dockerfile
    environment:
      PORT: '3001'
      KAOGONGSI_DATA_DIR: /data # 日志文件目录
      KAOGONGSI_JWT_SECRET: ${KAOGONGSI_JWT_SECRET:-please-change-in-prod}
      # 防腐层：DB=Postgres/Prisma，缓存=Redis
      DATABASE_URL: ${DATABASE_URL:-postgresql://kaogongsi:kaogongsi@db:5432/kaogongsi}
      REDIS_URL: ${REDIS_URL:-redis://cache:6379}
      # 可选：接真实 LLM（对比报告）——留空则离线模板
      KAOGONGSI_LLM_BASE_URL: ${KAOGONGSI_LLM_BASE_URL:-}
      KAOGONGSI_LLM_API_KEY: ${KAOGONGSI_LLM_API_KEY:-}
      KAOGONGSI_LLM_MODEL: ${KAOGONGSI_LLM_MODEL:-}
      # 可选：轨迹接入（RFC-006）
      KAOGONGSI_INGEST: ${KAOGONGSI_INGEST:-}
      KAOGONGSI_PARSERS: ${KAOGONGSI_PARSERS:-}
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
    volumes:
      - kg-data:/data
      # - ./trajectories:/trajectories:ro
    ports:
      - '3001:3001'
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: example/web/Dockerfile
    depends_on:
      - api
    ports:
      - '8080:80'
    restart: unless-stopped

volumes:
  kg-data:
  pg-data:
